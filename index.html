
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SiteSync AI | AI Site Supervisor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
    
    :root {
      --color-linen: #FAF9F6;
      --color-beige: #F2EFEA;
      --color-espresso: #2D241E;
      --color-leather: #8B5E3C;
      --color-tan: #D4A373;
      --color-sienna: #A44A3F;
      --shadow-arch: 0 20px 50px -12px rgba(45, 36, 30, 0.15);
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--color-linen);
      color: var(--color-espresso);
      overflow-x: hidden;
      touch-action: manipulation;
    }
    
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    .arch-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: var(--shadow-arch);
      border-radius: 2rem;
    }

    .glass-morphism {
      background: rgba(255, 255, 255, 0.7) !important;
      backdrop-filter: blur(16px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.4) !important;
    }

    /* Bottom Sheet Styling */
    .bottom-sheet {
      transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
    }
    
    .bottom-sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(0,0,0,0.1);
      border-radius: 2px;
      margin: 12px auto;
    }

    @keyframes scanning {
      0% { top: 0%; opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { top: 100%; opacity: 0; }
    }

    .scanning-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #FFB800, transparent);
      box-shadow: 0 0 20px #FFB800;
      animation: scanning 3s ease-in-out infinite;
      z-index: 5;
      pointer-events: none;
    }

    .marker-pulse {
      animation: tech-pulse 2s infinite ease-in-out;
    }

    @keyframes tech-pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 0.4; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(139, 94, 60, 0.2); border-radius: 10px; }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Fix for mobile keyboard pushing UI */
    @media (max-height: 450px) {
      .hide-on-keyboard { display: none; }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
