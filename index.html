
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe-Construct | AI Site Supervisor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
    
    :root {
      --color-linen: #FAF9F6;
      --color-beige: #F2EFEA;
      --color-espresso: #2D241E;
      --color-leather: #8B5E3C;
      --color-tan: #D4A373;
      --color-sienna: #A44A3F;
      --shadow-arch: 0 10px 40px -10px rgba(45, 36, 30, 0.1);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--color-linen);
      color: var(--color-espresso);
      overflow: hidden;
    }
    
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    .arch-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(212, 163, 115, 0.15);
      box-shadow: var(--shadow-arch);
      border-radius: 1.5rem;
    }

    .glass-morphism {
      background: rgba(250, 249, 246, 0.65) !important;
      backdrop-filter: blur(15px) !important;
      -webkit-backdrop-filter: blur(15px) !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
    }

    @keyframes scanning {
      0% { top: 0%; opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { top: 100%; opacity: 0; }
    }

    .scanning-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--color-leather), transparent);
      box-shadow: 0 0 15px var(--color-leather);
      animation: scanning 4s linear infinite;
      z-index: 5;
      pointer-events: none;
    }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0px var(--color-leather); }
      50% { box-shadow: 0 0 15px var(--color-leather); }
      100% { box-shadow: 0 0 0px var(--color-leather); }
    }

    .progress-pulse {
      animation: pulse-glow 2s infinite;
    }

    .calibration-reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      pointer-events: none;
      z-index: 10;
    }

    .reticle-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.4);
    }
    
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--color-beige); }
    ::-webkit-scrollbar-thumb { background: var(--color-tan); border-radius: 10px; }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
